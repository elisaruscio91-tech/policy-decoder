app {
  port = 8080
  port = ${?PORT}
  jwt-secret = ${JWT_SECRET}
}

db {
  # Stesso formato usato prima con Prisma: postgres://user:pass@host:port/db
  url = ${DATABASE_URL}
}

ai {
  provider = "anthropic"
  provider = ${?AI_PROVIDER}

  anthropic {
    api-key = ""
    api-key = ${?ANTHROPIC_API_KEY}
    workspace-id = ${?ANTHROPIC_WORKSPACE_ID}
    model = "claude-sonnet-4-6"
    model = ${?ANTHROPIC_MODEL}
  }
  openrouter {
    api-key = ""
    api-key = ${?OPENROUTER_API_KEY}
    model = "meta-llama/llama-3.3-70b-instruct"
    model = ${?OPENROUTER_MODEL}
  }
  ollama {
    base-url = ""
    base-url = ${?OLLAMA_BASE_URL}
    api-key = ${?OLLAMA_API_KEY}
    model = "qwen2.5:32b"
    model = ${?OLLAMA_MODEL}
  }
}

quota {
  default-monthly = 5
  default-monthly = ${?DEFAULT_MONTHLY_QUOTA}
}

embedding {
  # Modello di embedding usato per il RAG (archivio fonti), sempre via
  # ai.ollama.base-url (self-hosted) indipendentemente da AI_PROVIDER.
  model = "nomic-embed-text"
  model = ${?EMBEDDING_MODEL}
}

email {
  # Resend (https://resend.com/api-keys). Senza questa chiave, le email di
  # alert/conferma per le richieste di accesso vengono solo loggate (vedi
  # EmailService) invece di fallire l'intera richiesta.
  resend-api-key = ""
  resend-api-key = ${?RESEND_API_KEY}
  # Dominio policy-decoder.com verificato su Resend (DKIM confermato): può
  # scrivere a indirizzi arbitrari, a differenza del sender di test
  # "onboarding@resend.dev" (solo all'email dell'account Resend stesso).
  from = "Policy Decoder <noreply@policy-decoder.com>"
  from = ${?EMAIL_FROM}
  admin = "elisa.ruscio@proton.me"
  admin = ${?EMAIL_ADMIN}
}
